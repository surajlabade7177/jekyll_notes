<!DOCTYPE html>
<html>

<head>
    <title>{{ site.title }}</title> <!-- From the front matter title variable to the here -->


    <!-- This is the link of the file where we have written the CSS of navbar -->
     <link rel="stylesheet" href="{{ '/assets/css/navbar.style.css' | relative_url }}">

    <style>
        /* Whole page */
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f1f5f9;
            color: #1e293b;
        }

        /* Header */
        header {
            background-color: #2563eb;
            color: white;
            padding: 30px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 32px;
        }

        header p {
            margin: 8px 0 0;
            color: #dbeafe;
        }

        /* Main content area */
        main {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
        }

        /* Blog post card */
        .post {
            background-color: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        /* Post title */
        .post-title {
            color: #0f172a;
            font-size: 36px;
            margin-top: 0;
            margin-bottom: 10px;
        }

        /* Post information */
        .post-info {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 25px;
        }

        /* Category badge */
        .category {
            display: inline-block;
            background-color: #dbeafe;
            color: #1d4ed8;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
        }

        /* Markdown content */
        .post-content {
            line-height: 1.8;
            font-size: 17px;
        }

        .post-content h2 {
            color: #2563eb;
            margin-top: 30px;
        }

        .post-content h3 {
            color: #334155;
        }

        .post-content code {
            background-color: #f1f5f9;
            padding: 3px 6px;
            border-radius: 4px;
        }

        .post-content li {
            margin-bottom: 8px;
        }

        /* Footer */
        footer {
            background-color: #0f172a;
            color: #cbd5e1;
            text-align: center;
            padding: 25px;
            margin-top: 50px;
        }
    </style>
</head>

<body>

    <!-- 
    NOTE: Here we are including the navbar here.
          We are also passing the attributes for it and acess it the navbar file.
    -->
    {% include navbar.html color="lightblue"%}

    <!-- High-level wrapper -->
    <header>
        <h1>My Jekyll Blog</h1>
        <p>Learning Jekyll step by step</p>
    </header>


    <main>

        <article class="post">

            <!-- Data from Front Matter -->
            <h1 class="post-title">
                {{ page.title }}
            </h1>

            <div class="post-info">

                <span class="category">
                    {{ page.categories }}
                </span>

                &nbsp;

                Published:
                {{ page.date | date: "%B %d, %Y" }}

            </div>


            <!-- Markdown content -->
            <div class="post-content">

                {{ content }}

            </div>

        </article>

    </main>


    <!-- High-level wrapper -->
    <footer>
        <p>© 2026 My Jekyll Blog | Built with Jekyll</p>
    </footer>

</body>

</html>

What is Jekyll ?
Ans: Jekyll is a static site generator. 
     Jekyll was created by Tom Preston-Werner in 2008.
     It takes text written in your favorite markup language and uses layouts to create a static website.
     You can change the site’s look and feel, URLs, the data displayed on the page, and more.
     
Why we use the Jekyll ?
Ans: We use Jekyll mainly when we want to build a fast, simple, content-focused website without needing backend server or database.
     Suppose you want to create a documentation or blog website.

Front Matter: 

What is Jekyll Front Matter
Ans: Front Matter is the information at the top of a Jekyll page that tells Jekyll how to handle that page.
     Metadata at the top of a Jekyll file that tells Jekyll how to process that page.
     It is written between three dashes ---. With key value pair
     For e.g ==>
      ---
     layout: post
     title: My First Blog
     date: 2026-09-26
     ---


NOTE: Front Matter can be written in YAML OR JSON.
      We can also create a our custom Front Matter variable and add it there and access it within posts.

What is _drafts in Jekyll?
Ans: _drafts is a folder where we can keep blog posts that are not ready to publish yet.

      when generating the post's date/URL, depending on the configuration and how the draft is processed.

Permalinks in Jekyll:   { refer 2026-09-27-permalink-demo.markdown }

What is Permalink ?
Ans: A permalink is simply the URL (web address) of a page or post on your Jekyll website.
     For e.g  ==> https://example.com/about/
     Here, /about/ is the permalink.

NOTE: 1) We can provide the custom permalink with "permalink" attribute in front matter.
      For e.g ==> 
     ---
          layout: "post"
          title: "Permalink attribute demo"
          categories: testing testing2

          permalink: "/testing-path/test/test2"
         
     ---
      2) We can also give the ref of the other attributes in the parmalink as bellow.
      for e.g => 
      ---
        layout: "post"
        title: "Permalink attribute demo"
        categories: testing testing2

        permalink: /:categories/:title

        OR 

        permalink: /:categories/:year/:month/:day/:title:output_ext
      ---

Front Matter Defaults:   {Refer _config.yml file}

What is Front Matter Defaults ?
Ans: Front Matter Defaults allow you to set default Front Matter values for multiple pages or posts in one place in "_config.yml" file.
     Instead of writing the same Front Matter again and again in every file, you define it once in _config.yml.

     For E.g ==> We can write below things in  _config.yml.

     defaults:
          - scope:                    # scope tells Jekyll which files should get these defaults.
               path: ""               # an empty string here means all files in the project.
               type: "posts"          # Apply these defaults to all posts or posts under _posts folder.
            values:                   # What defaults values should they get?
               layout: "post"
               author: "Hitman_45"
               title: "Testing front matter defaults"

NOTE: 1) After modifying the _config.yml file we need to restart the project or instance.
      2) If we spcify the type: "posts" and any post under _posts folder has other attributes provided in that file front matter then it will give priority to it.

Themes in Jekyll:

When we create a new Jekyll website Jekyll installs a site that uses a gem-based theme called Minima.
Default theme Minima.

We can search the themes on the ==> https://rubygems.org/

How to install all dependencies from the Gemfile?
> bundle install


NOTE: In Jekyll, moving from one theme to another can be quite challenging.
     Because themes may have different:
          Layouts —> e.g., _layouts/default.html, post.html
          Includes —> reusable components like header, footer, navigation
          CSS/JavaScript —> each theme may style and structure things differently
          Front Matter —> themes may expect different variables such as layout, author, categories, etc.
          Configuration —> _config.yml settings can differ
          Plugins —> one theme may depend on plugins that another doesn't use

What is mean by variables in Jekyll ?
Ans: In Jekyll variables are values that Jekyll/Liquid provides or that you define yourself, and you use them inside your HTML templates.
     Example: page.title

Common Jekyll variables we will frequently see these:
Main Jekyll objects:

| Object            | Simple meaning                     | Example                 |
| ----------------- | ---------------------------------- | ----------------------- |
| `site`            | Entire website level variable      | `{{ site.title }}`      |
| `page`            | Current page/post                  | `{{ page.title }}`      |
| `layout`          | Current layout's data              | `{{ layout.author }}`   |
| `content`         | Content being passed into a layout | `{{ content }}`         |
| `paginator`       | Pagination information             | `{{ paginator.page }}`  |
| `site.posts`      | All blog posts                     | `{{ site.posts }}`      |
| `site.data`       | Data from `_data`                  | `{{ site.data.users }}` |
| `site.categories` | Posts grouped by category          | `{{ site.categories }}` |
| `site.tags`       | Posts grouped by tag               | `{{ site.tags }}`       |


NOTE: Everything you see after a dot is not a separate Jekyll object.
     site, page, layout → objects
     title, author, posts, categories → properties/data inside those objects.

So don't try to memorize everything at once. For your current Jekyll learning, I'd learn in this order:
site → page → layout → content → site.posts → site.data → Liquid loops/conditions.

NOTE: "site" variable most of the time deals with the _config.yml file related data there which is website level data.

Includes in Jekyll:   {refer the _includes folder and navbar.html file and wrapper_layout.html file}

What is includes in jekyll ?
Ans: Includes in Jekyll as reusable small pieces of HTML that you can create once and use in many places.
     Think it like a component or we can say common component sytem we uses in react js.

Why do we need Includes?
Ans: Suppose your website has the same navbar on 10 pages.
     Instead of writing this navbar HTML on every page, you can create it once as an include.
     we can have the _includes folder and inside we can create navbar.html file.
     <nav>
          <a href="/">Home</a>
          <a href="/about/">About</a>
          <a href="/contact/">Contact</a>
     </nav>
    Now we can use that navbar in our wraper or other html files.

    We can use the  {% include navbar.html %}

NOTE: Refer navbar.html, wrapper_layout.html, navbar.style.css files.

      This is the link of the file where we have written the CSS of navbar
     <link rel="stylesheet" href="{{ '/assets/css/navbar.style.css' | relative_url }}">
      Need to add this under <head> tag in wrapper or other file where we are using the navbar file.

NOTE: We can pass values/attributes from the layout (wrapper) to an Include. This is very useful in Jekyll.
          
     {% include navbar.html color="lightblue"%}   ==> Passing from the wrapper_layout.html

     We can use it like this -> navbar.html
     <div class="nav-links" style="background-color: {{ include.color }};">

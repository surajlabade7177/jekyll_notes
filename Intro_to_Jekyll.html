What is Jekyll ?
Ans: Jekyll is a static site generator. 
     Jekyll was created by Tom Preston-Werner in 2008.
     It takes text written in your favorite markup language and uses layouts to create a static website.
     You can change the site’s look and feel, URLs, the data displayed on the page, and more.
     
Why we use the Jekyll ?
Ans: We use Jekyll mainly when we want to build a fast, simple, content-focused website without needing backend server or database.
     Suppose you want to create a documentation or blog website.


**************************************************** Video 2 & 3 *****************************************************


How to install Jekyll on Windows ?
Ans: We need the two things when we are installing the Jekyll.
     1) Ruby => Programming Langugae
     2) RubyGems => Package Manager for Ruby

NOTE: We can download the Ruby from Ruby installer ==>  https://rubyinstaller.org/downloads/
      After download the Ruby, A cmd window will open and we need to install the below things from it.
        1 - MSYS2 base installation
        2 - MSYS2 system update (optional)
        3 - MSYS2 and MINGW development toolchain
      RubyGem will also gets installed during this installation. Like "npm" gets installed during "Nodejs".

How to check the Ruby version ?
> ruby -v

How to check the RubyGem version ?  {Package Manager for Ruby}
> gem -v

How to install Jekyll ?
> gem install jekyll bundler

How to check the Ruby version ?
> jekyll -v


**************************************************** Video 4 *****************************************************

How to create a new Jekyll project ?
> jekyll new project_name_here

How to run the Jekyll Project ?
> bundle exec jekyll serve       // Need to do this first time only.

> jekyll serve  // From second time we can use this only

NOTE: webite will be run on localhost:4000 port.

How to add the live reload to Jekyll website while development ?
> jekyll server --livereload
For E.g ==>> bundle exec jekyll serve --livereload    OR    > jekyll serve --livereload


Jekyll Folder Structure :

| File / Folder    | Simple meaning                       
| ---------------- | ------------------------------------ 
| `_config.yml`    | ⚙️ Website settings and configuration.                
| `index.markdown` | 🏠 Home page                         
| `about.markdown` | 👤 About page                        
| `_posts/`        | 📝 Blog posts                        
| `_site/`         | 🚀 Final website generated by Jekyll, finished final version of website.
| `404.html`       | ❌ Page not found                     
| `Gemfile`        | 💎 This file is used with Jekyll/Ruby to store all dependencies of website.        
| `Gemfile.lock`   | 🔒 Exact dependency versions and more detailed data.
| `.jekyll-cache/` | 🗃️ Temporary Jekyll files           
| `.gitignore`     | 🚫 Tells Git what not to track

Front Matter: 

What is Jekyll Front Matter
Ans: Front Matter is the information at the top of a Jekyll page that tells Jekyll how to handle that page.
     Metadata at the top of a Jekyll file that tells Jekyll how to process that page.
     It is written between three dashes ---. With key value pair
     For e.g ==>
      ---
     layout: post
     title: My First Blog
     date: 2026-09-26
     ---


NOTE: Front Matter can be written in YAML OR JSON.
      We can also create a our custom Front Matter variable and add it there and access it within posts.
